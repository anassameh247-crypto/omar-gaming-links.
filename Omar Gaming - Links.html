<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Omar Gaming</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070b;--card:rgba(255,255,255,.04);--text:#f5f1e6;--muted:#a8a08a;--g1:#f6e3a1;--g2:#d4a73a;--g3:#8a6a1c;--border:rgba(212,167,58,.28);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#faf6ea;--card:rgba(255,255,255,.8);--text:#1d180a;--muted:#6f6445;--border:rgba(138,106,28,.35)}}
:root[data-theme="light"]{--bg:#faf6ea;--card:rgba(255,255,255,.8);--text:#1d180a;--muted:#6f6445;--border:rgba(138,106,28,.35)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Cairo',Tahoma,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:44px 18px;
background-image:radial-gradient(ellipse at 50% -10%,rgba(212,167,58,.28),transparent 55%),radial-gradient(ellipse at 50% 110%,rgba(212,167,58,.14),transparent 55%)}
main{width:100%;max-width:440px;text-align:center}
.ring{width:112px;height:112px;border-radius:50%;margin:0 auto 18px;padding:3px;background:conic-gradient(var(--g1),var(--g3),var(--g1),var(--g2),var(--g1));animation:spin 8s linear infinite;box-shadow:0 0 40px rgba(212,167,58,.35)}
.ring span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--bg);font-size:44px;font-weight:900;animation:spin 8s linear infinite reverse;
color:transparent;background-image:linear-gradient(135deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text}
.ring img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;background:#000;animation:spin 8s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:30px;font-weight:900;letter-spacing:.5px;background:linear-gradient(90deg,var(--g1),var(--g2),var(--g1));-webkit-background-clip:text;background-clip:text;color:transparent}
.line{width:70px;height:2px;margin:12px auto;background:linear-gradient(90deg,transparent,var(--g2),transparent)}
p.sub{color:var(--muted);margin-bottom:30px;font-size:15px}
a.link{position:relative;display:flex;align-items:center;gap:14px;padding:15px 16px;margin-bottom:14px;border-radius:18px;background:var(--card);border:1px solid var(--border);
backdrop-filter:blur(8px);color:var(--text);text-decoration:none;font-weight:700;font-size:17px;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s;animation:rise .6s both}
a.link:nth-of-type(2){animation-delay:.1s}a.link:nth-of-type(3){animation-delay:.2s}a.link:nth-of-type(4){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
a.link::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(246,227,161,.18) 50%,transparent 70%);transform:translateX(120%);transition:transform .6s}
a.link:hover{transform:translateY(-3px);border-color:var(--g2);box-shadow:0 10px 30px rgba(212,167,58,.25)}
a.link:hover::before{transform:translateX(-120%)}
.ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:none;background:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));color:#1a1405;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.t{flex:1;text-align:right}
.t small{display:block;color:var(--muted);font-weight:400;font-size:12px;letter-spacing:.4px}
.arrow{color:var(--g2);font-size:22px}
a.soon{border-style:dashed;pointer-events:none}
a.soon .ic{filter:grayscale(.5);opacity:.7}
a.soon .t,a.soon .arrow{opacity:.65}
footer{color:var(--muted);font-size:12px;margin-top:24px;letter-spacing:1px}
</style>
</head>
